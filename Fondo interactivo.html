<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cielo Interactivo Liquid Glass - Elián</title>
    <style>
        :root {
            --sky-top: #02010f;
            --sky-bottom: #050a1e;
            --stars-opacity: 1;
            --sun-color: #ffea70;
            --moon-color: #e6e8d2;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 100%);
            transition: background 1s linear;
        }

        /* Contenedor principal */
        #sky {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        /* --- ESTRELLAS --- */
        #stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: var(--stars-opacity);
            transition: opacity 2s ease;
            z-index: 2;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 8px rgba(255,255,255,0.8); }
        }

        /* --- SOL Y LUNA --- */
        #celestial-pivot {
            position: absolute;
            bottom: -20vh; /* Bajamos el pivote para hacer el arco mucho más amplio */
            left: 50%;
            width: 0;
            height: 0;
            z-index: 3;
            transition: transform 0.5s linear;
        }

        .celestial-body {
            position: absolute;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        #sun {
            width: 100px;
            height: 100px;
            background: var(--sun-color);
            box-shadow: 
                0 0 60px 20px rgba(255, 234, 112, 0.7), 
                0 0 150px 50px rgba(255, 140, 0, 0.5),
                0 0 300px 100px rgba(255, 80, 0, 0.3);
            bottom: 95vh; /* El sol ahora se eleva hasta el 75% de la pantalla, muy por encima de las montañas */
        }

        #moon {
            width: 70px;
            height: 70px;
            background: var(--moon-color);
            box-shadow: 
                0 0 30px 10px rgba(230, 232, 210, 0.4), 
                inset -15px -15px 20px rgba(0,0,0,0.3);
            top: 95vh; /* La luna también sube hasta lo más alto en la noche */
        }

        /* --- NUBES --- */
        .cloud {
            position: absolute;
            z-index: 4;
            animation: moveClouds linear infinite;
            pointer-events: none;
        }

        .cloud-body {
            position: relative;
            width: 100%; 
            height: 100%;
            background: #ffffff;
            border-radius: 100px;
            /* Sombra interna para dar volumen y sombra exterior para profundidad */
            box-shadow: 
                inset 0 -8px 15px rgba(0, 0, 0, 0.08), 
                0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .cloud-body::before, .cloud-body::after {
            content: '';
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            /* Sombra interna para las cúpulas de la nube */
            box-shadow: inset 0 -5px 10px rgba(0, 0, 0, 0.03);
        }

        /* Nube 1 (Fondo) */
        .cloud1 { width: 200px; height: 60px; top: 12%; left: -250px; animation-duration: 75s; opacity: 0.6; filter: scale(0.8); }
        .cloud1 .cloud-body::before { width: 100px; height: 100px; top: -45px; left: 25px; }
        .cloud1 .cloud-body::after { width: 70px; height: 70px; top: -30px; right: 25px; }

        /* Nube 2 (Frente media) */
        .cloud2 { width: 160px; height: 50px; top: 32%; left: -200px; animation-duration: 60s; animation-delay: -25s; opacity: 0.85; }
        .cloud2 .cloud-body::before { width: 80px; height: 80px; top: -35px; left: 20px; }
        .cloud2 .cloud-body::after { width: 60px; height: 60px; top: -25px; right: 20px; }

        /* Nube 3 (Alta y rápida) */
        .cloud3 { width: 120px; height: 40px; top: 8%; left: -150px; animation-duration: 90s; animation-delay: -50s; opacity: 0.4; }
        .cloud3 .cloud-body::before { width: 60px; height: 60px; top: -25px; left: 15px; }
        .cloud3 .cloud-body::after { width: 45px; height: 45px; top: -15px; right: 15px; }

        @keyframes moveClouds {
            from { transform: translateX(-20vw); }
            to { transform: translateX(120vw); }
        }

        /* --- PAISAJE: MONTAÑAS VERDES PREMIUM --- */
        #mountains-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50vh; /* Un poco más altas para mayor majestuosidad */
            z-index: 10;
            pointer-events: none;
            transition: filter 1s linear;
            /* Se oscurece en la noche mediante JS */
            filter: brightness(var(--land-bright, 1));
            overflow: hidden;
        }

        #mountains {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #mountains svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Capa de Niebla Volumétrica Animada */
        .fog-layer {
            position: absolute;
            bottom: 5vh;
            left: 0;
            width: 200%;
            height: 35vh;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg"><path d="M0 150 Q 250 50 500 150 T 1000 150 L 1000 200 L 0 200 Z" fill="rgba(255,255,255,0.08)"/><path d="M0 180 Q 300 100 600 180 T 1200 180 L 1200 200 L 0 200 Z" fill="rgba(255,255,255,0.05)"/></svg>') repeat-x;
            background-size: 50% 100%;
            z-index: 11;
            pointer-events: none;
            animation: driftFog 80s linear infinite;
            mix-blend-mode: screen;
            opacity: 0.8;
        }

        @keyframes driftFog {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* --- RELOJ LIQUID GLASS --- */
        #center-clock-container {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            padding: 20px 50px;
            border-radius: 40px;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #center-clock {
            margin: 0;
            font-size: clamp(8rem, 15vw, 16rem); /* Responsive, muy grande */
            font-weight: 800; /* Letra mucho más gruesa */
            letter-spacing: -2px;
            
            /* Efecto transparente con reflejo interno */
            color: transparent;
            background: linear-gradient(
                180deg, 
                rgba(255, 255, 255, 0.95) 0%, 
                rgba(255, 255, 255, 0.1) 35%, 
                rgba(255, 255, 255, 0.0) 60%, 
                rgba(255, 255, 255, 0.6) 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            
            /* Borde del cristal */
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.4);
            
            /* Sombras 3D: sombra interior clara, sombra exterior oscura */
            filter: 
                drop-shadow(0px 15px 25px rgba(0, 0, 0, 0.4))
                drop-shadow(0px -2px 3px rgba(255, 255, 255, 0.6));
        }

        /* --- WIDGETS IOS (GLASSMORPHISM) --- */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border-radius: 25px;
            color: white;
        }

        #ui {
            position: absolute;
            bottom: 40px;
            right: 40px;
            padding: 25px;
            z-index: 20;
            text-align: center;
            min-width: 280px;
            font-weight: bold;
        }

        #ui p {
            margin: 0 0 20px 0;
            font-size: 1.1rem;
            font-weight: 700; /* Letra más gruesa en el saludo */
        }

        .slider-container { margin-bottom: 20px; }

        input[type=range] {
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
            accent-color: #ffffff;
            opacity: 0.8;
        }
        
        input[type=range]:hover { opacity: 1; }

        button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 800; /* Botón mucho más grueso */
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            #ui {
                bottom: 25px;
                right: 50%;
                transform: translateX(50%);
                width: 85%;
                padding: 20px;
            }
            #sun { bottom: 40vh; width: 70px; height: 70px; }
            #moon { top: 40vh; width: 50px; height: 50px; }
            #center-clock { font-size: clamp(5rem, 25vw, 8rem); -webkit-text-stroke: 1px rgba(255, 255, 255, 0.4); }
        }
    </style>
</head>
<body>

    <div id="sky">
        <div id="stars"></div>
        
        <!-- Nubes -->
        <div class="cloud cloud1"><div class="cloud-body"></div></div>
        <div class="cloud cloud2"><div class="cloud-body"></div></div>
        <div class="cloud cloud3"><div class="cloud-body"></div></div>

        <!-- Sistema Solar -->
        <div id="celestial-pivot">
            <div id="sun" class="celestial-body"></div>
            <div id="moon" class="celestial-body"></div>
        </div>

        <!-- Paisaje Montañoso Verde Premium -->
        <div id="mountains-container">
            <div id="mountains">
                <svg viewBox="0 0 1200 500" preserveAspectRatio="none">
                    <defs>
                        <!-- Degradado Pico Lejano (Atmosférico, verdoso-azulado) -->
                        <linearGradient id="m-far" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#2a4a4b" />
                            <stop offset="100%" stop-color="#15262a" />
                        </linearGradient>
                        <!-- Degradado Montañas Intermedias -->
                        <linearGradient id="m-mid-far" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#2a5a3b" />
                            <stop offset="100%" stop-color="#122a1b" />
                        </linearGradient>
                        <!-- Degradado Colinas Suaves -->
                        <linearGradient id="m-mid" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#357a41" />
                            <stop offset="100%" stop-color="#164020" />
                        </linearGradient>
                        <!-- Degradado Pradera Cercana -->
                        <linearGradient id="m-close" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#45964d" />
                            <stop offset="100%" stop-color="#194d23" />
                        </linearGradient>
                        <!-- Degradado Base Ultra Oscura -->
                        <linearGradient id="m-front" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#1e4d27" />
                            <stop offset="100%" stop-color="#051207" />
                        </linearGradient>
                    </defs>
                    
                    <!-- Capa 1: Montañas Lejanas (Picos completamente redondeados) -->
                    <path d="M 0 500 L 0 250 Q 40 170 100 210 T 220 150 T 340 260 T 470 130 T 600 280 T 710 180 T 800 250 T 910 120 T 1050 280 T 1150 190 T 1200 240 L 1200 500 Z" fill="url(#m-far)" opacity="0.8"/>
                    
                    <!-- Capa 2: Montañas Intermedias Altas (Curvas suaves) -->
                    <path d="M 0 500 L 0 290 Q 140 170 280 290 T 530 180 T 750 310 T 930 180 T 1100 310 T 1200 260 L 1200 500 Z" fill="url(#m-mid-far)" opacity="0.9"/>
                    
                    <!-- Capa 3: Colinas Centrales (Ondulaciones orgánicas) -->
                    <path d="M 0 500 L 0 340 Q 160 250 330 360 T 700 260 T 1080 350 L 1200 290 L 1200 500 Z" fill="url(#m-mid)"/>
                    
                    <!-- Capa 4: Praderas Delanteras -->
                    <path d="M 0 500 L 0 390 Q 250 310 480 410 T 980 350 T 1200 430 L 1200 500 Z" fill="url(#m-close)"/>
                    
                    <!-- Capa 5: Base (Efecto viñeta en el suelo) -->
                    <path d="M 0 500 L 0 460 Q 300 380 650 480 T 1200 440 L 1200 500 Z" fill="url(#m-front)"/>
                </svg>
            </div>
            <!-- Capa de Niebla Animada -->
            <div class="fog-layer"></div>
        </div>

        <!-- Reloj Central Liquid Glass -->
        <div id="center-clock-container">
            <h1 id="center-clock">00:00</h1>
        </div>

        <!-- Panel de Control Glassmorphism -->
        <div id="ui" class="glass-panel">
            <p>¡Hola, <strong>Elián</strong>!</p>
            <div class="slider-container">
                <label for="time-slider" style="display: block; font-size: 0.95rem; font-weight: 800; opacity: 0.9; margin-bottom: 5px;">Viaja en el tiempo:</label>
                <input type="range" id="time-slider" min="0" max="23.99" step="0.05" value="12">
            </div>
            <button id="sync-btn">Sincronizado con Hora Real</button>
        </div>
    </div>

    <script>
        // Nueva Paleta de Colores Inspirada en Atardeceres de Playa Vibrantes
        const skyColors = [
            { time: 0,  top: [2, 1, 15],    bottom: [5, 10, 30] },      // Noche profunda
            { time: 4,  top: [2, 1, 15],    bottom: [15, 20, 45] },     // Madrugada
            { time: 5.5,top: [40, 20, 60],  bottom: [150, 50, 60] },    // Alba (rojizo)
            { time: 6.5,top: [100, 120, 180],bottom: [255, 160, 100] }, // Amanecer dorado
            { time: 8,  top: [40, 120, 220],bottom: [120, 190, 250] },  // Mañana brillante
            { time: 12, top: [20, 90, 180], bottom: [80, 160, 240] },   // Mediodía despejado
            { time: 16, top: [30, 100, 200],bottom: [100, 180, 250] },  // Tarde
            { time: 17.5,top:[80, 60, 120], bottom: [250, 180, 100] },  // Pre-atardecer
            { time: 18.5,top:[50, 25, 60],  bottom: [255, 80, 30] },    // ATARDECER PLAYA (Magenta/Naranja intenso)
            { time: 19.5,top:[15, 15, 40],  bottom: [60, 20, 50] },     // Crepúsculo
            { time: 21, top: [2, 1, 15],    bottom: [10, 15, 35] },     // Noche
            { time: 24, top: [2, 1, 15],    bottom: [5, 10, 30] }       // Medianoche
        ];

        let realTimeInterval;
        let isManualMode = false;

        function createStars() {
            const starsContainer = document.getElementById('stars');
            const numStars = 200;
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 70}%`; // Sobre el océano
                const size = Math.random() * 2.5 + 0.5;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                star.style.animationDelay = `${Math.random() * 5}s`;
                starsContainer.appendChild(star);
            }
        }

        function lerp(start, end, t) { return start + (end - start) * t; }

        function lerpColor(color1, color2, t) {
            return [
                Math.round(lerp(color1[0], color2[0], t)),
                Math.round(lerp(color1[1], color2[1], t)),
                Math.round(lerp(color1[2], color2[2], t))
            ];
        }

        function updateEnvironment(hours) {
            // Actualizar Reloj Liquid Glass
            const h = Math.floor(hours);
            const m = Math.floor((hours - h) * 60);
            document.getElementById('center-clock').innerText = 
                `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;

            // Rotación del sol/luna
            const angle = (hours - 12) * 15; 
            document.getElementById('celestial-pivot').style.transform = `rotate(${angle}deg)`;

            // Opacidad de estrellas
            let starsOpacity = 0;
            if (hours >= 19.5 || hours <= 5) starsOpacity = 1;
            else if (hours > 5 && hours < 6) starsOpacity = 1 - (hours - 5);
            else if (hours > 18.5 && hours < 19.5) starsOpacity = (hours - 18.5);
            document.documentElement.style.setProperty('--stars-opacity', starsOpacity);

            // Transición de colores de cielo
            let startColorObj, endColorObj;
            for (let i = 0; i < skyColors.length - 1; i++) {
                if (hours >= skyColors[i].time && hours < skyColors[i+1].time) {
                    startColorObj = skyColors[i];
                    endColorObj = skyColors[i+1];
                    break;
                }
            }
            if (!startColorObj) { startColorObj = skyColors[0]; endColorObj = skyColors[1]; }

            const timeDiff = endColorObj.time - startColorObj.time;
            const progress = (hours - startColorObj.time) / timeDiff;

            const currentTop = lerpColor(startColorObj.top, endColorObj.top, progress);
            const currentBottom = lerpColor(startColorObj.bottom, endColorObj.bottom, progress);

            document.documentElement.style.setProperty('--sky-top', `rgb(${currentTop[0]}, ${currentTop[1]}, ${currentTop[2]})`);
            document.documentElement.style.setProperty('--sky-bottom', `rgb(${currentBottom[0]}, ${currentBottom[1]}, ${currentBottom[2]})`);

            // Iluminación del paisaje (oscurecer montañas de noche)
            const sunHeight = Math.sin((hours - 6) * (Math.PI / 12));
            const landscapeBrightness = Math.max(0.15, sunHeight * 0.7 + 0.3);
            document.documentElement.style.setProperty('--land-bright', landscapeBrightness);
        }

        function syncRealTime() {
            if (isManualMode) return;
            const now = new Date();
            const decimalTime = now.getHours() + (now.getMinutes() / 60) + (now.getSeconds() / 3600);
            updateEnvironment(decimalTime);
            document.getElementById('time-slider').value = decimalTime;
        }

        window.addEventListener('DOMContentLoaded', () => {
            createStars();
            
            const slider = document.getElementById('time-slider');
            const syncBtn = document.getElementById('sync-btn');

            slider.addEventListener('input', (e) => {
                isManualMode = true;
                syncBtn.style.background = "rgba(255, 100, 100, 0.4)";
                syncBtn.innerText = "Reanudar Tiempo Real";
                updateEnvironment(parseFloat(e.target.value));
            });

            syncBtn.addEventListener('click', () => {
                isManualMode = false;
                syncBtn.style.background = "rgba(255, 255, 255, 0.15)";
                syncBtn.innerText = "Sincronizado con Hora Real";
                syncRealTime();
            });

            syncRealTime();
            realTimeInterval = setInterval(syncRealTime, 1000);
        });
    </script>
</body>
</html>
